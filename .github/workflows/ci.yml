name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history + tags: tests/release-state.test.ts asserts against this
          # repo's real commits and tags (gitBumpCommitExists/gitTagExists). The
          # default fetch-depth: 1 checkout carries neither, so those tests read
          # empty history and fail here while passing on any full local clone.
          fetch-depth: 0

      - name: Set up pnpm
        # Exact tag, unlike the other two actions: this repo's floating v6 tag lags
        # its releases (v6 -> v6.0.10 while v6.1.0 is out), so @v6 is not the latest.
        # No `with.version`: action-setup reads package.json's `packageManager` field
        # instead (v6.1.0's README confirms `version` is optional whenever that field
        # names pnpm v11+), so the pinned version lives in exactly one place.
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Dist drift gate (committed dist/ must match a fresh build)
        run: |
          pnpm run build
          if ! git diff --exit-code dist/companion.cjs; then
            echo "::error::dist/companion.cjs is out of date with src/. Run 'pnpm run build' and commit the rebuilt bundle."
            exit 1
          fi

  windows:
    name: CI (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DEBT: only tests/run-codex.test.ts runs here, the file that exercises the
      # Windows codex resolution and spawn planning; its POSIX-only cases skip on win32.
      # The rest of the suite fakes `codex` as an extensionless `#!/bin/sh` script that
      # the win32 resolver (.com/.exe/.bat/.cmd only) never finds, so it cannot pass here.
      # Upgrade path: give those fakes win32 `codex.cmd` shims, the way tests/fake-claude.mjs
      # is driven, then run the full `pnpm test` (which also needs `core.autocrlf false`
      # before checkout and `fetch-depth: 0` for tests/release-state.test.ts).
      - name: Test (Windows codex resolution and spawn)
        run: node --test tests/run-codex.test.ts
